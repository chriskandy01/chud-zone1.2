<meta name="description" content="Autoregulated hypertrophy training log." />

<meta name="theme-color" content="#0A0A0B" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<style>
  html, body { margin: 0; padding: 0; background: #0A0A0B; height: 100%; overscroll-behavior: none; }

  /* --- splash --- */
  #cz-boot {
    position: fixed; inset: 0; z-index: 999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0A0A0B;
    transition: opacity 520ms ease, visibility 520ms;
  }
  #cz-boot.cz-gone { opacity: 0; visibility: hidden; pointer-events: none; }
  .cz-boot-mark {
    opacity: 0; transform: scale(0.78) translateY(8px);
    animation: czMarkIn 900ms cubic-bezier(.16,.84,.28,1) 120ms forwards,
               czBreathe 2600ms ease-in-out 1020ms infinite;
  }
  .cz-boot-word {
    margin-top: 20px;
    font-family: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
    font-size: 30px; font-weight: 700; color: #F2EFEF;
    letter-spacing: 16px; text-indent: 16px;
    opacity: 0;
    animation: czWordIn 1100ms cubic-bezier(.16,.84,.28,1) 560ms forwards;
  }
  .cz-boot-rule {
    margin-top: 18px; height: 2px; width: 0; border-radius: 2px;
    background: linear-gradient(90deg, transparent, #E02B2B 18%, #E02B2B 82%, transparent);
    animation: czRuleIn 820ms cubic-bezier(.16,.84,.28,1) 1020ms forwards;
  }
  @keyframes czMarkIn {
    0%   { opacity: 0; transform: scale(0.78) translateY(8px); }
    55%  { opacity: 1; transform: scale(1.06) translateY(0); }
    78%  { transform: scale(0.985) translateY(0); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes czBreathe {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(224,43,43,0)); }
    50%      { filter: drop-shadow(0 0 18px rgba(224,43,43,0.45)); }
  }
  @keyframes czWordIn {
    0%   { opacity: 0; letter-spacing: 22px; text-indent: 22px; }
    55%  { opacity: 1; }
    100% { opacity: 1; letter-spacing: 4px; text-indent: 4px; }
  }
  @keyframes czRuleIn {
    0%   { width: 0; opacity: 0; }
    100% { width: 190px; opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cz-boot-mark, .cz-boot-word, .cz-boot-rule { animation-duration: 1ms !important; animation-delay: 0ms !important; }
    .cz-boot-word { opacity: 1; letter-spacing: 3.4px; }
    .cz-boot-mark { opacity: 1; transform: none; }
  }
  #root { height: 100%; }
  body { -webkit-user-select: none; user-select: none; }
  input, select, textarea { -webkit-user-select: text; user-select: text; }
</style>
<script>
/* Storage shim: the app talks to window.storage; on your phone that is localStorage. */
(function () {
  function safe(fn, fallback) { try { return fn(); } catch (e) { return fallback; } }
  window.storage = {
    get: function (key) {
      var v = safe(function () { return localStorage.getItem('platelog:' + key); }, null);
      return Promise.resolve(v === null ? null : { key: key, value: v, shared: false });
    },
    set: function (key, value) {
      safe(function () { localStorage.setItem('platelog:' + key, value); });
      return Promise.resolve({ key: key, value: value, shared: false });
    },
    delete: function (key) {
      safe(function () { localStorage.removeItem('platelog:' + key); });
      return Promise.resolve({ key: key, deleted: true, shared: false });
    },
    list: function (prefix) {
      var keys = safe(function () {
        return Object.keys(localStorage)
          .filter(function (k) { return k.indexOf('platelog:') === 0; })
          .map(function (k) { return k.slice(9); })
          .filter(function (k) { return !prefix || k.indexOf(prefix) === 0; });
      }, []);
      return Promise.resolve({ keys: keys, prefix: prefix, shared: false });
    }
  };
})();
</script>
</head>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      function watch(worker) {
        if (!worker) return;
        worker.addEventListener('statechange', function () {
          if (worker.state === 'installed' && navigator.serviceWorker.controller) {
            window.__chudUpdateReady = true;
            window.dispatchEvent(new Event('chud-update'));
          }
        });
      }
      if (reg.waiting && navigator.serviceWorker.controller) {
        window.__chudUpdateReady = true;
        window.dispatchEvent(new Event('chud-update'));
      }
      watch(reg.installing);
      reg.addEventListener('updatefound', function () { watch(reg.installing); });
      setInterval(function () { reg.update().catch(function () {}); }, 30 * 60 * 1000);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reg.update().catch(function () {});
      });
    }).catch(function () {});

    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloading) return;
      reloading = true;
      window.location.reload();
    });
  });
}
</script>
